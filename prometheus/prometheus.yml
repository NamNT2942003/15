global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Bài 4: Tự động phát hiện targets qua targets.json
  - job_name: "microservices"
    file_sd_configs:
      - files:
          - "targets.json"
        refresh_interval: 30s

  # Bài 5: Giám sát Spring Boot Cart Service qua Actuator Prometheus
  - job_name: "cart-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 15s
    static_configs:
      - targets: ["cart-service:8080"]
